<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Input Raport Siswa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (xlsx) for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Sticky column styling for master rekap table */
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 10;
            background-color: white;
        }
        .sticky-col-header {
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: #065f46; /* emerald-800 */
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz.../exec"; // Ganti dengan URL Apps Script Anda
        
        // ADMIN PASSWORD
        const ADMIN_PASSWORD_HASH = "@SMPN38BDL";

        const LIST_MAPEL = [
            "BAHASA INDONESIA",
            "MATEMATIKA",
            "PJOK",
            "IPS",
            "BAHASA INGGRIS",
            "IPA",
            "PRAKARYA",
            "PAI",
            "PAK",
            "BAHASA LAMPUNG",
            "INFORMATIKA",
            "PENDIDIKAN PANCASILA"
        ];

        // Daftar Nama Siswa Sesuai Input Terbaru (Otomatis dikonversi ke Huruf Kapital Semua)
        const RAW_SISWA = [
            "ADE EVA KINANTI",
            "ADINDA SHEFA RHAMADANI",
            "AHMAD RAIHAN",
            "Alvino Ridwan Pratama",
            "AMANDA AFRILIA",
            "CAHYA BR SINAMBELA",
            "DARWAN ALVIANSYAH",
            "DIAN APRILIA PUTRI",
            "Ghlora Noe Kheyla",
            "Haikal Pratama",
            "HOLIK AKBAR",
            "IQBAL HIDAYATULLOH",
            "JUNI PRATAMA",
            "Kafa Jehsen Cristian",
            "M. ARIFIN",
            "M. KHAIRUL AZZAM",
            "MINAFA ADZKIA MALVIN",
            "Muhamad Alfatih Suherman",
            "MUHAMMAD REVAN ABI PRATAMA",
            "MUHAMMAD RIDHO SAPUTRA",
            "Naila Azzahra Sopyan",
            "NAUFAL SHIDQI ARLIS",
            "Nirmala Nia Putri",
            "POLIN MANURUNG",
            "RAYSHA SESALIA WATTY",
            "RYAN DWI ISNANTO",
            "SALWA NABILA PUTRI",
            "SILSILA FADILA",
            "SUCI MASNAWATI",
            "Syami Ahmad Azzanky",
            "ZAHRA ANYA RACHMA LAKSONO"
        ];

        const DEFAULT_SISWA = RAW_SISWA.map(nama => nama.toUpperCase());

        function App() {
            const [activeTab, setActiveTab] = useState('input'); // 'input' or 'admin'
            const [selectedMapel, setSelectedMapel] = useState(LIST_MAPEL[0]);
            const [scriptUrl, setScriptUrl] = useState(DEFAULT_SCRIPT_URL);
            
            // State data nilai: { "NAMA SISWA": { "BAHASA INDONESIA": { ph1: 80, ph2: 85, pts: 90 }, ... } }
            const [gradesData, setGradesData] = useState({});
            
            // Status UI
            const [loading, setLoading] = useState(false);
            const [statusMessage, setStatusMessage] = useState({ type: '', text: '' });
            
            // Admin Modal & Auth
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [adminError, setAdminError] = useState('');

            useEffect(() => {
                const savedGrades = localStorage.getItem('raport_grades_data');
                if (savedGrades) {
                    try {
                        setGradesData(JSON.parse(savedGrades));
                    } catch (e) {
                        initDefaultData();
                    }
                } else {
                    initDefaultData();
                }
            }, []);

            const initDefaultData = () => {
                const initial = {};
                DEFAULT_SISWA.forEach(nama => {
                    initial[nama] = {};
                    LIST_MAPEL.forEach(mapel => {
                        initial[nama][mapel] = { ph1: '', ph2: '', pts: '' };
                    });
                });
                setGradesData(initial);
                localStorage.setItem('raport_grades_data', JSON.stringify(initial));
            };

            const handleGradeChange = (nama, mapel, field, value) => {
                // Validasi nilai angka 0 - 100 atau kosong
                if (value !== '') {
                    const num = Number(value);
                    if (isNaN(num) || num < 0 || num > 100) return;
                }

                setGradesData(prev => {
                    const updated = {
                        ...prev,
                        [nama]: {
                            ...prev[nama],
                            [mapel]: {
                                ...prev[nama]?.[mapel],
                                [field]: value
                            }
                        }
                    };
                    localStorage.setItem('raport_grades_data', JSON.stringify(updated));
                    return updated;
                });
            };

            const handleBulkSave = async () => {
                setLoading(true);
                setStatusMessage({ type: 'info', text: `Menyimpan nilai ${selectedMapel} ke server...` });

                const payload = {
                    action: "saveGrades",
                    mapel: selectedMapel,
                    data: DEFAULT_SISWA.map(nama => ({
                        nama: nama,
                        ph1: gradesData[nama]?.[selectedMapel]?.ph1 || 0,
                        ph2: gradesData[nama]?.[selectedMapel]?.ph2 || 0,
                        pts: gradesData[nama]?.[selectedMapel]?.pts || 0
                    }))
                };

                try {
                    // Jika URL belum diatur atau dummy, simpan lokal sukses dengan simulasi network
                    if (!scriptUrl || scriptUrl.includes("AKfycbz")) {
                        await new Promise(resolve => setTimeout(resolve, 800));
                        setStatusMessage({ type: 'success', text: `Berhasil Disimpan! Nilai ${selectedMapel} telah tersimpan.` });
                    } else {
                        const response = await fetch(scriptUrl, {
                            method: 'POST',
                            mode: 'no-cors', // standard untuk Google Apps Script web app
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        setStatusMessage({ type: 'success', text: `Berhasil Disimpan ke Google Sheets untuk mapel ${selectedMapel}!` });
                    }
                } catch (error) {
                    console.error("Error saving:", error);
                    setStatusMessage({ type: 'error', text: 'Gagal menyimpan ke server. Data tersimpan di perangkat lokal.' });
                } finally {
                    setLoading(false);
                    setTimeout(() => setStatusMessage({ type: '', text: '' }), 4000);
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                // Verifikasi password admin
                if (adminPassword === '@SMPN38BDL') {
                    setIsAdminAuthenticated(true);
                    setShowAdminModal(false);
                    setAdminPassword('');
                    setAdminError('');
                    setActiveTab('admin');
                } else {
                    setAdminError('Password salah!');
                }
            };

            const exportToExcel = () => {
                // Membuat struktur data flat untuk sheetJS atau rekap menyamping
                const rekapRows = [];
                
                // Header baris 1: Informasi Master Rekap
                rekapRows.push(["MASTER REKAP NILAI RAPORT SISWA"]);
                rekapRows.push([`Diexport pada: ${new Date().toLocaleString()}`]);
                rekapRows.push([]); // baris kosong

                // Header baris 3: Nama Kolom Utama
                const headerRow1 = ["NO", "NAMA SISWA"];
                LIST_MAPEL.forEach(mapel => {
                    headerRow1.push(mapel, "", ""); // placeholder untuk PH1, PH2, PTS
                });
                rekapRows.push(headerRow1);

                // Header baris 4: Sub Kolom (PH1, PH2, PTS)
                const headerRow2 = ["", ""];
                LIST_MAPEL.forEach(() => {
                    headerRow2.push("PH 1", "PH 2", "PTS");
                });
                rekapRows.push(headerRow2);

                // Data Siswa
                DEFAULT_SISWA.forEach((nama, idx) => {
                    const rowData = [idx + 1, nama];
                    LIST_MAPEL.forEach(mapel => {
                        const score = gradesData[nama]?.[mapel] || { ph1: '', ph2: '', pts: '' };
                        rowData.push(score.ph1 !== '' ? Number(score.ph1) : '');
                        rowData.push(score.ph2 !== '' ? Number(score.ph2) : '');
                        rowData.push(score.pts !== '' ? Number(score.pts) : '');
                    });
                    rekapRows.push(rowData);
                });

                // Buat Worksheet
                const ws = XLSX.utils.aoa_to_sheet(rekapRows);

                // Konfigurasi Merge Cells untuk Header Mapel di atas
                // Contoh: mapel pertama di kolom C (index 2) s.d E (index 4)
                if(!ws['!merges']) ws['!merges'] = [];
                
                // Merge title
                ws['!merges'].push({ s: { r: 0, c: 0 }, e: { r: 0, c: 2 + (LIST_MAPEL.length * 3) - 1 } });
                ws['!merges'].push({ s: { r: 1, c: 0 }, e: { r: 1, c: 2 + (LIST_MAPEL.length * 3) - 1 } });

                // Merge Header Mapel secara horizontal (masing-masing 3 kolom)
                LIST_MAPEL.forEach((mapel, index) => {
                    const startCol = 2 + (index * 3);
                    ws['!merges'].push({ s: { r: 3, c: startCol }, e: { r: 3, c: startCol + 2 } });
                });

                // Buat Workbook dan download
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Master Rekap Nilai");
                XLSX.writeFile(wb, "Master_Rekap_Nilai_Raport.xlsx");
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    {}
                    <header className="bg-emerald-700 text-white shadow-md sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
                            <div className="flex items-center space-x-3">
                                <div className="bg-emerald-800 p-2.5 rounded-xl border border-emerald-600 shadow-inner">
                                    <i className="fa-solid fa-graduation-cap text-xl text-emerald-200"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold tracking-tight">INPUT RAPORT SISWA</h1>
                                    <p className="text-xs text-emerald-200">Portal Guru Mapel & Wali Kelas / Admin</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => setActiveTab('input')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 ${
                                        activeTab === 'input' 
                                            ? 'bg-white text-emerald-800 shadow' 
                                            : 'bg-emerald-800/60 text-white hover:bg-emerald-600'
                                    }`}
                                >
                                    <i className="fa-solid fa-pen-to-square"></i> Input Guru Mapel
                                </button>
                                <button
                                    onClick={() => {
                                        if (isAdminAuthenticated) {
                                            setActiveTab('admin');
                                        } else {
                                            setShowAdminModal(true);
                                        }
                                    }}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 ${
                                        activeTab === 'admin' 
                                            ? 'bg-white text-emerald-800 shadow' 
                                            : 'bg-emerald-800/60 text-white hover:bg-emerald-600'
                                    }`}
                                >
                                    <i className="fa-solid fa-lock"></i> Master Rekap (Admin)
                                </button>
                            </div>
                        </div>
                    </header>

                    {}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
                        {statusMessage.text && (
                            <div className={`mb-4 p-4 rounded-xl text-sm font-medium flex items-center gap-3 shadow-sm transition-all ${
                                statusMessage.type === 'success' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' :
                                statusMessage.type === 'error' ? 'bg-red-50 text-red-800 border border-red-200' : 
                                'bg-blue-50 text-blue-800 border border-blue-200'
                            }`}>
                                <i className={`fa-solid ${
                                    statusMessage.type === 'success' ? 'fa-circle-check text-emerald-600 text-lg' :
                                    statusMessage.type === 'error' ? 'fa-circle-exclamation text-red-600 text-lg' : 
                                    'fa-spinner fa-spin text-blue-600 text-lg'
                                }`}></i>
                                <span>{statusMessage.text}</span>
                            </div>
                        )}

                        {activeTab === 'input' ? (
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-5 border-b border-slate-100 bg-slate-50/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h2 className="text-base font-bold text-slate-800">Form Input Nilai Mata Pelajaran</h2>
                                        <p className="text-xs text-slate-500 mt-0.5">Silakan pilih mata pelajaran lalu masukkan nilai Penilaian Harian & PTS (0 - 100).</p>
                                    </div>
                                    <div className="w-full md:w-auto flex items-center gap-2">
                                        <label className="text-sm font-semibold text-slate-700 whitespace-nowrap">Mapel:</label>
                                        <select
                                            value={selectedMapel}
                                            onChange={(e) => setSelectedMapel(e.target.value)}
                                            className="w-full md:w-64 bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 shadow-sm"
                                        >
                                            {LIST_MAPEL.map(m => (
                                                <option key={m} value={m}>{m}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-emerald-800 text-white text-xs uppercase tracking-wider">
                                                <th className="py-3 px-4 w-16 text-center">No</th>
                                                <th className="py-3 px-4">Nama Siswa</th>
                                                <th className="py-3 px-4 text-center w-32">PH 1 (0-100)</th>
                                                <th className="py-3 px-4 text-center w-32">PH 2 (0-100)</th>
                                                <th className="py-3 px-4 text-center w-32">PTS (0-100)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 text-sm">
                                            {DEFAULT_SISWA.map((nama, idx) => {
                                                const score = gradesData[nama]?.[selectedMapel] || { ph1: '', ph2: '', pts: '' };
                                                return (
                                                    <tr key={nama} className="hover:bg-slate-50/80 transition-colors">
                                                        <td className="py-3 px-4 text-center text-slate-500 font-medium">{idx + 1}</td>
                                                        <td className="py-3 px-4 font-semibold text-slate-800">{nama}</td>
                                                        <td className="py-2 px-3 text-center">
                                                            <input
                                                                type="number"
                                                                min="0"
                                                                max="100"
                                                                value={score.ph1}
                                                                onChange={(e) => handleGradeChange(nama, selectedMapel, 'ph1', e.target.value)}
                                                                placeholder="0"
                                                                className="w-20 text-center bg-slate-50 border border-slate-200 rounded-lg py-1.5 px-2 text-sm font-semibold focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                                            />
                                                        </td>
                                                        <td className="py-2 px-3 text-center">
                                                            <input
                                                                type="number"
                                                                min="0"
                                                                max="100"
                                                                value={score.ph2}
                                                                onChange={(e) => handleGradeChange(nama, selectedMapel, 'ph2', e.target.value)}
                                                                placeholder="0"
                                                                className="w-20 text-center bg-slate-50 border border-slate-200 rounded-lg py-1.5 px-2 text-sm font-semibold focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                                            />
                                                        </td>
                                                        <td className="py-2 px-3 text-center">
                                                            <input
                                                                type="number"
                                                                min="0"
                                                                max="100"
                                                                value={score.pts}
                                                                onChange={(e) => handleGradeChange(nama, selectedMapel, 'pts', e.target.value)}
                                                                placeholder="0"
                                                                className="w-20 text-center bg-slate-50 border border-slate-200 rounded-lg py-1.5 px-2 text-sm font-semibold focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                                            />
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="p-4 bg-slate-50 border-t border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                                    <div className="text-xs text-slate-500 flex items-center gap-1.5">
                                        <i className="fa-solid fa-circle-info text-emerald-600"></i>
                                        <span>Data otomatis tersimpan di browser Anda saat diketik. Klik tombol simpan untuk mengirim ke database.</span>
                                    </div>
                                    <button
                                        onClick={handleBulkSave}
                                        disabled={loading}
                                        className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-xl shadow-sm hover:shadow transition-all flex items-center justify-center gap-2 disabled:opacity-50"
                                    >
                                        {loading ? (
                                            <i className="fa-solid fa-spinner fa-spin"></i>
                                        ) : (
                                            <i className="fa-solid fa-cloud-arrow-up"></i>
                                        )}
                                        <span>Simpan Nilai [{selectedMapel}]</span>
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-5 border-b border-slate-100 bg-slate-50/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <h2 className="text-base font-bold text-slate-800">Master Rekap Nilai Seluruh Mata Pelajaran</h2>
                                            <span className="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">Mode Admin / Wali Kelas</span>
                                        </div>
                                        <p className="text-xs text-slate-500 mt-0.5">Tabel rekapitulasi nilai lengkap siswa untuk semua mata pelajaran.</p>
                                    </div>
                                    <div className="flex items-center gap-2 w-full md:w-auto">
                                        <button
                                            onClick={exportToExcel}
                                            className="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2"
                                        >
                                            <i className="fa-solid fa-file-excel"></i>
                                            <span>Unduh Master Excel (.xlsx)</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="overflow-x-auto max-h-[70vh]">
                                    <table className="w-full text-left border-collapse whitespace-nowrap">
                                        <thead>
                                            <tr className="bg-emerald-900 text-white text-xs uppercase tracking-wider">
                                                <th rowSpan="2" className="py-3 px-3 text-center sticky-col-header z-30 border-r border-emerald-700 w-12">No</th>
                                                <th rowSpan="2" className="py-3 px-4 sticky-col-header z-30 border-r border-emerald-700 left-12 min-w-[200px]">Nama Siswa</th>
                                                {LIST_MAPEL.map(mapel => (
                                                    <th key={mapel} colSpan="3" className="py-2 px-3 text-center border-r border-emerald-700 bg-emerald-800">
                                                        {mapel}
                                                    </th>
                                                ))}
                                            </tr>
                                            <tr className="bg-emerald-800 text-white text-[11px] uppercase tracking-wider">
                                                {LIST_MAPEL.map(mapel => (
                                                    <React.Fragment key={mapel + '-sub'}>
                                                        <th className="py-2 px-2 text-center border-r border-emerald-700 bg-emerald-800/90 w-14">PH 1</th>
                                                        <th className="py-2 px-2 text-center border-r border-emerald-700 bg-emerald-800/90 w-14">PH 2</th>
                                                        <th className="py-2 px-2 text-center border-r border-emerald-700 bg-emerald-800/90 w-14">PTS</th>
                                                    </React.Fragment>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 text-xs">
                                            {DEFAULT_SISWA.map((nama, idx) => (
                                                <tr key={nama} className="hover:bg-slate-50 transition-colors">
                                                    <td className="py-3 px-3 text-center font-medium text-slate-500 sticky-col bg-white border-r border-slate-100">{idx + 1}</td>
                                                    <td className="py-3 px-4 font-semibold text-slate-800 sticky-col bg-white border-r border-slate-100 left-12">{nama}</td>
                                                    {LIST_MAPEL.map(mapel => {
                                                        const score = gradesData[nama]?.[mapel] || { ph1: '', ph2: '', pts: '' };
                                                        return (
                                                            <React.Fragment key={mapel + '-' + nama}>
                                                                <td className="py-3 px-2 text-center border-r border-slate-100 font-medium text-slate-700">{score.ph1 !== '' ? score.ph1 : '-'}</td>
                                                                <td className="py-3 px-2 text-center border-r border-slate-100 font-medium text-slate-700">{score.ph2 !== '' ? score.ph2 : '-'}</td>
                                                                <td className="py-3 px-2 text-center border-r border-slate-100 font-medium text-slate-700">{score.pts !== '' ? score.pts : '-'}</td>
                                                            </React.Fragment>
                                                        );
                                                    })}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    {showAdminModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100 animate-in fade-in zoom-in duration-200">
                                <div className="flex justify-between items-center mb-4">
                                    <div className="flex items-center space-x-2.5">
                                        <div className="bg-emerald-100 p-2 rounded-xl text-emerald-700">
                                            <i className="fa-solid fa-lock text-lg"></i>
                                        </div>
                                        <h3 className="text-base font-bold text-slate-800">Proteksi Master Rekap</h3>
                                    </div>
                                    <button 
                                        onClick={() => setShowAdminModal(false)}
                                        className="text-slate-400 hover:text-slate-600 transition-colors"
                                    >
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>
                                
                                <p className="text-xs text-slate-500 mb-4">
                                    Akses ke Master Rekap dan Unduh Excel dilindungi password khusus untuk Wali Kelas / Admin.
                                </p>

                                <form onSubmit={handleAdminLogin}>
                                    <div className="mb-4">
                                        <label className="block text-xs font-semibold text-slate-700 mb-1.5">PASSWORD ADMIN</label>
                                        <input
                                            type="password"
                                            value={adminPassword}
                                            onChange={(e) => setAdminPassword(e.target.value)}
                                            placeholder="Masukkan password..."
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                            autoFocus
                                        />
                                        {adminError && <p className="text-xs text-red-600 mt-1.5 font-medium">{adminError}</p>}
                                    </div>

                                    <div className="flex gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowAdminModal(false)}
                                            className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold py-2.5 rounded-xl transition-all"
                                        >
                                            Batal
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-2.5 rounded-xl shadow-sm transition-all"
                                        >
                                            Masuk
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {}
                    <footer className="mt-auto py-4 text-center text-xs text-slate-400 border-t border-slate-100 bg-white">
                        <p>© 2026 Sistem Raport Siswa • Integrasi Google Apps Script & SheetJS</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
